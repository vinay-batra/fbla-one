name: DB backup

# Nightly off-platform logical backup of the Supabase Postgres database, kept as a
# 90-day GitHub artifact so a copy survives a Supabase-side incident (audit
# SRE-5F-01). No-op (green) until the SUPABASE_DB_URL repo secret is set
# (Settings -> Secrets and variables -> Actions). See docs/DISASTER-RECOVERY.md.
#
# NOTE: the `secrets` context is NOT allowed inside `if:` conditionals - doing so
# makes the whole workflow invalid (a startup failure on every run). Read the
# secret into a job-level env var (allowed) and gate steps on a step OUTPUT.

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily (~02:00-03:00 ET)
  workflow_dispatch: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check for the DB URL secret
        id: guard
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL secret not set - skipping backup. See docs/DISASTER-RECOVERY.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install postgres client (pg_dump 16)
        if: steps.guard.outputs.configured == 'true'
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Dump
        if: steps.guard.outputs.configured == 'true'
        run: |
          STAMP="$(date -u +%F)"
          pg_dump "$SUPABASE_DB_URL" -Fc -f "backup-$STAMP.dump"
          echo "Wrote backup-$STAMP.dump ($(du -h "backup-$STAMP.dump" | cut -f1))"

      - name: Upload artifact (90-day retention)
        if: steps.guard.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backup-*.dump
          retention-days: 90
